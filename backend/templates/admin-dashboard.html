<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BinBuddy Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" />
    <style>
        :root {
            --primary: #1a5276;
            --secondary: #1e8449;
            --light-bg: #f0f4f8;
            --sidebar-w: 250px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light-bg); display: flex; min-height: 100vh; }
        
        /* SIDEBAR */
        #sidebar {
            width: var(--sidebar-w);
            background: var(--primary);
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }
        #sidebar .brand {
            padding: 20px;
            background: rgba(0, 0, 0, .25);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
        }
        #sidebar .brand i { font-size: 1.6rem; color: #2ecc71; }
        #sidebar nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, .8);
            text-decoration: none;
            transition: .2s;
        }
        #sidebar nav a:hover, #sidebar nav a.active {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            border-left: 3px solid #2ecc71;
        }
        #sidebar nav a i { width: 20px; text-align: center; }
        #sidebar .sidebar-footer {
            padding: 15px 20px;
            font-size: .75rem;
            color: rgba(255, 255, 255, .35);
            border-top: 1px solid rgba(255, 255, 255, .1);
            margin-top: auto;
        }

        /* MAIN */
        #main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }

        /* TOPBAR */
        #topbar {
            background: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .page-title { font-weight: 600; color: var(--primary); font-size: 1.05rem; }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .88rem;
            cursor: pointer;
        }
        .avatar {
            width: 32px;
            height: 32px;
            background: var(--secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
        }

        /* SECTIONS */
        .page-section { display: none; padding: 24px; animation: fadeIn .2s; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px) } to { opacity: 1; transform: none } }

        /* KPI GRID */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }
        .kpi-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 13px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
        }
        .kpi-icon {
            width: 46px;
            height: 46px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .kpi-value { font-size: 1.75rem; font-weight: 800; line-height: 1; }
        .kpi-label { font-size: .74rem; color: #777; margin-top: 3px; }

        /* CARD BOX */
        .card-box {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .07);
            overflow: hidden;
        }
        .card-box-header {
            padding: 13px 18px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: .92rem;
        }

        /* TABLE */
        .table-wrap { max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .87rem; }
        th {
            background: #f8fafc;
            color: #555;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
            position: sticky;
            top: 0;
        }
        td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
        tr:hover td { background: #f8f9fa; }

        .badge-approved { background: #2ecc71; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .badge-pending { background: #f39c12; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        
        .btn-small {
            background: #1a5276;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-small:hover { background: #154360; }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div id="sidebar">
        <div class="brand"><i class="bi bi-shield-check"></i> BinBuddy Admin</div>
        <nav>
            <a href="#" class="active" onclick="return nav('users')"><i class="bi bi-people-fill"></i> User Management</a>
            <a href="#" onclick="return nav('workers')"><i class="bi bi-person-badge"></i> Workers</a>
        </nav>
        <div class="sidebar-footer">Admin v1.0<br>© 2026 BinBuddy</div>
    </div>

    <!-- MAIN -->
    <div id="main">
        <!-- TOPBAR -->
        <div id="topbar">
            <div class="page-title" id="page-title">Admin Dashboard</div>
            <div style="display:flex;align-items:center;gap:16px">
                <span id="clock" style="font-size:.81rem;color:#888"></span>
                <div class="user-chip" onclick="logout()">
                    <div class="avatar" id="u-avatar">A</div>
                    <span id="u-name">Admin</span>
                    <i class="bi bi-box-arrow-right" style="color:#bbb;font-size:.9rem"></i>
                </div>
            </div>
        </div>

        <!-- Admin handles municipal registration approvals only. Overview/live/bins/complaints/reports removed per request -->

        <!-- USER MANAGEMENT -->
        <div class="page-section active" id="section-users">
            <div class="card-box">
                <div class="card-box-header">
                    <span><i class="bi bi-people-fill"></i> User Approvals</span>
                    <button class="btn btn-sm btn-outline-success" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr>
                        </thead>
                        <tbody id="users-tbody"><tr><td colspan="5" style="text-align:center;padding:20px">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- WORKERS -->
        <div class="page-section" id="section-workers">
            <div class="card-box">
                <div class="card-box-header">
                    <span><i class="bi bi-person-badge"></i> Workers/Collectors</span>
                    <button class="btn btn-sm btn-outline-success" onclick="loadWorkers()"><i class="bi bi-arrow-clockwise"></i></button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr><th>Name</th><th>Phone</th><th>Status</th><th>Collections Today</th><th>Action</th></tr>
                        </thead>
                        <tbody id="workers-tbody"><tr><td colspan="5" style="text-align:center;padding:20px">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- REPORTS -->
        <div class="page-section" id="section-reports">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card-box">
                        <div class="card-box-header"><i class="bi bi-pie-chart"></i> Daily Summary</div>
                        <div style="padding:20px">
                            <div><strong>Total collections:</strong> <span id="rep-collections">—</span></div>
                            <div style="margin-top:10px"><strong>Average fill level:</strong> <span id="rep-avg-fill">—</span></div>
                            <div style="margin-top:10px"><strong>Complaints resolved:</strong> <span id="rep-resolved">—</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card-box">
                        <div class="card-box-header"><i class="bi bi-download"></i> Export</div>
                        <div style="padding:20px">
                            <button class="btn btn-primary" onclick="alert('Export Today Report')"><i class="bi bi-download"></i> Today's Report</button>
                            <button class="btn btn-primary" style="margin-top:10px" onclick="alert('Export Monthly Report')"><i class="bi bi-download"></i> Monthly Report</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let TOKEN = localStorage.getItem('access_token');
        let USER = JSON.parse(localStorage.getItem('user') || '{}');

        function nav(name) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('#sidebar nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('section-' + name)?.classList.add('active');
            document.querySelectorAll('#sidebar nav a').forEach(a => {
                if (a.getAttribute('onclick')?.includes(`'${name}'`)) a.classList.add('active');
            });
            const titles = { overview: 'Dashboard Overview', live: 'Live Monitor', bins: 'All Bins', complaints: 'Complaints', users: 'User Management', workers: 'Workers', reports: 'Reports' };
            document.getElementById('page-title').textContent = titles[name] || name;
            
            if (name === 'bins') loadBins();
            if (name === 'complaints') loadComplaints();
            if (name === 'users') loadUsers();
            if (name === 'workers') loadWorkers();
            if (name === 'reports') loadReports();
            return false;
        }

        function boot() {
            document.getElementById('u-name').textContent = USER.name || 'Admin';
            document.getElementById('u-avatar').textContent = (USER.name || 'A')[0].toUpperCase();
            startClock();
            // admin now focuses on approving municipal registrations and worker overview
            loadUsers();
            loadWorkers();
        }

        function startClock() {
            setInterval(() => {
                document.getElementById('clock').textContent = new Date().toLocaleString('en-IN', { hour12: true });
            }, 1000);
        }

        async function api(path) {
            try {
                const h = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` };
                const r = await fetch(API_BASE + path, { headers: h });
                if (r.status === 401) { logout(); return null; }
                return await r.json();
            } catch (e) { console.error(e); return null; }
        }

        async function loadKPIs() {
            const s = await api('/reports/summary');
            if (s) {
                document.getElementById('k-total').textContent = s.total_bins || 0;
                document.getElementById('k-full').textContent = s.full_bins || 0;
                document.getElementById('k-empty').textContent = s.empty_bins || 0;
                document.getElementById('k-coll').textContent = s.collected_today || 0;
                document.getElementById('k-comp').textContent = s.open_complaints || 0;
                document.getElementById('k-workers').textContent = s.active_workers || 0;
            }
        }

        async function loadBins() {
            const bins = await api('/bins/');
            if (!bins) return;
            document.getElementById('bins-tbody').innerHTML = bins.map(b => `
                <tr>
                    <td><strong>${b.bin_code}</strong></td>
                    <td>${b.location_name || '—'}</td>
                    <td>${(parseFloat(b.fill_level || 0)).toFixed(1)}%</td>
                    <td>${b.status}</td>
                    <td>${b.battery_level || 'N/A'}%</td>
                    <td>${new Date(b.last_updated || Date.now()).toLocaleTimeString('en-IN')}</td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="text-align:center">No bins found</td></tr>';
        }

        async function loadComplaints() {
            const items = await api('/complaints/');
            if (!items) return;
            document.getElementById('comp-count').textContent = items.filter(c => c.status === 'open').length;
            document.getElementById('comp-tbody').innerHTML = items.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.category}</td>
                    <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${c.description}</td>
                    <td>${c.priority}</td>
                    <td><span class="badge bg-${c.status === 'open' ? 'warning' : 'success'}">${c.status}</span></td>
                    <td><button class="btn-small" onclick="alert('Manage complaint')">Manage</button></td>
                </tr>
            `).join('') || '<tr><td colspan="6" style="text-align:center">No complaints</td></tr>';
        }

        async function loadUsers() {
            const users = await api('/auth/users');
            if (!users) return;
            document.getElementById('users-tbody').innerHTML = users.map(u => `
                <tr>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td>${u.role}</td>
                    <td><span class="badge-${u.is_approved ? 'approved' : 'pending'}">${u.is_approved ? 'Approved' : 'Pending'}</span></td>
                    <td>${!u.is_approved && u.role === 'municipal_office' ? `<button class="btn-small" onclick="approveUser(${u.id})">Approve</button>` : '—'}</td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center">No users</td></tr>';
        }

        async function approveUser(userId) {
            if (!confirm('Approve this user?')) return;
            const res = await fetch(`${API_BASE}/auth/approve/${userId}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' }
            });
            if (res.ok) { alert('✅ User approved'); loadUsers(); } else alert('❌ Approval failed');
        }

        async function loadWorkers() {
            const users = await api('/auth/users?role=collector');
            if (!users) return;
            document.getElementById('workers-tbody').innerHTML = users.map(w => `
                <tr>
                    <td>${w.name}</td>
                    <td>${w.phone}</td>
                    <td><span class="badge-${w.is_active ? 'approved' : 'pending'}">${w.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>—</td>
                    <td><button class="btn-small">View Details</button></td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center">No workers</td></tr>';
        }

        async function loadReports() {
            const s = await api('/reports/summary');
            if (s) {
                document.getElementById('rep-collections').textContent = s.collected_today || 0;
                document.getElementById('rep-avg-fill').textContent = ((s.total_bins ? (s.full_bins / s.total_bins * 100) : 0).toFixed(1)) + '%';
                document.getElementById('rep-resolved').textContent = (s.total_complaints ? (s.total_complaints - s.open_complaints) : 0) || 0;
            }
        }

        function logout() { localStorage.clear(); location.href = '/'; }

        if (TOKEN && USER.role === 'admin') boot();
        else if (!TOKEN || USER.role !== 'admin') { alert('Unauthorized'); location.href = '/'; }
    </script>
</body>
</html>
